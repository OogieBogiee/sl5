<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colina Combustibles - Web en Construcción</title>
    <link rel="icon" type="image/x-icon" href="img/isotipo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=0.2.1">
</head>
<body class="construction">

    <div class="construction__background"></div>

    <div class="construction__container">

        <!-- Header / Logo -->
        <header class="construction__header">
            <img src="img/logo.webp" alt="Colina Combustibles Logo" class="construction__logo">
        </header>

        <!-- Main Content -->
        <main class="construction__content">
            <div class="construction__text-wrapper">
                <h1 class="construction__title">
                    <span class="construction__title--solid">WEB EN</span><br>
                    <span class="construction__title--outline">CONSTRUCCIÓN</span>
                </h1>
                <p class="construction__subtitle">
                    Nuestra plataforma está en proceso de ensamblaje. Muy pronto, toda
                    la potencia de Colina combustibles estará en tu pantalla.
                </p>
            </div>
        </main>

        <!-- Bottom Section: Countdown & Footer -->
        <div class="construction__bottom">

            <!-- Countdown Timer -->
            <section class="countdown" aria-label="Cuenta regresiva">
                <div class="countdown__item">
                    <div class="countdown__number" id="days">00</div>
                    <div class="countdown__label">DÍAS</div>
                </div>
                <div class="countdown__item">
                    <div class="countdown__number" id="hours">00</div>
                    <div class="countdown__label">HORAS</div>
                </div>
                <div class="countdown__item">
                    <div class="countdown__number" id="minutes">00</div>
                    <div class="countdown__label">MINUTOS</div>
                </div>
                <div class="countdown__item">
                    <div class="countdown__number" id="seconds">00</div>
                    <div class="countdown__label">SEGUNDOS</div>
                </div>
            </section>

            <!-- Footer / Contact -->
            <footer class="construction__footer">
                <p class="construction__footer-label">Contáctanos:</p>
                <a href="mailto:info@colinacombustibles.com" class="construction__contact-link">
                    info@colinacombustibles.com
                </a>
            </footer>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
